name: PR Guardian

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify OpenClaw
        env:
          HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOK_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          ACTION="${{ github.event.action }}"

          curl -sf -X POST "http://1.116.124.236:20622/hooks/agent" \
            -H "Authorization: Bearer $HOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "message": "blog-refactor PR #'"$PR_NUMBER"': '"$PR_TITLE"' ('"$ACTION"') by '"$PR_AUTHOR"' ['"$HEAD_BRANCH"' → '"$BASE_BRANCH"']. '"$PR_URL"'. 请执行 blog-pr-guardian skill 完整流程。",
              "name": "Blog PR Guardian",
              "channel": "feishu",
              "to": "user:ou_0c79482f81fb11d8951ef76b184c516f",
              "deliver": true
            }'
